    <style>
        /* ... (mesmo CSS anterior, sem alterações) ... */
        :root {
            --bg: #0b0b10;
            --surface: rgba(16, 16, 26, 0.97);
            --accent: #e50914;
            --text: #ededed;
            --text-secondary: #aaa;
            --radius: 18px;
            --transition: 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            --focus-outline: 3px solid #e50914;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Roboto', system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif;
            background: #000;
            color: var(--text);
            height: 100vh; height: 100dvh;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -webkit-user-select: none;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(229, 9, 20, 0.45); border-radius: 10px; }

        #serverSelectionScreen {
            position: fixed; inset: 0;
            background: radial-gradient(ellipse at 30% 30%, #0f0f1a, #020203);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; padding: 1.5rem;
        }
        #serverSelectionScreen h1 {
            font-size: 2.4rem; font-weight: 800;
            background: linear-gradient(135deg, #ff3b4a, #e50914, #b91c2c);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            letter-spacing: -0.02em; margin-bottom: 1.2rem; text-align: center;
        }
        .server-box {
            width: 100%; max-width: 520px;
            background: rgba(12, 12, 20, 0.85); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-radius: 32px; border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 0.5px rgba(229, 9, 20, 0.2);
            overflow: hidden; display: flex; flex-direction: column;
        }
        .server-scroll {
            max-height: 280px; overflow-y: auto; padding: 12px 14px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .server-scroll:empty::after {
            content: 'Nenhum servidor. Toque em "+" para adicionar.';
            display: block; text-align: center; padding: 25px 10px; color: #888; font-size: 0.8rem;
        }
        .server-card {
            background: rgba(25, 25, 35, 0.8); border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px; padding: 14px 16px; cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; gap: 12px;
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); outline: none;
        }
        .server-card:focus-visible { outline: var(--focus-outline); outline-offset: 2px; }
        .server-card:hover, .server-card:focus {
            background: rgba(229, 9, 20, 0.18); border-color: var(--accent);
            transform: translateY(-1px); box-shadow: 0 6px 14px rgba(0, 0, 0, 0.4);
        }
        .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #555; flex-shrink: 0; transition: 0.3s; }
        .status-dot.online { background: #00e676; box-shadow: 0 0 6px rgba(0, 230, 118, 0.5); }
        .status-dot.offline { background: #ff4d4d; box-shadow: 0 0 5px rgba(255, 77, 77, 0.5); }
        .server-info { flex: 1; min-width: 0; }
        .server-name { font-weight: 700; font-size: 0.95rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .server-url { font-size: 0.65rem; color: #999; margin-top: 3px; word-break: break-all; font-family: 'SF Mono', 'Fira Code', monospace; opacity: 0.75; }
        .delete-server {
            background: rgba(0,0,0,0.5); border: none; color: #ff8a8a; font-size: 1.1rem;
            cursor: pointer; padding: 6px 8px; border-radius: 40px; transition: var(--transition);
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .delete-server:hover { background: var(--accent); color: #fff; transform: scale(1.1); }
        .add-server-card {
            background: rgba(30, 30, 45, 0.6); border: 1px dashed rgba(255, 255, 255, 0.25);
            border-radius: 28px; padding: 13px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            color: #ccc; font-weight: 600; margin: 6px 14px 14px; font-size: 0.85rem;
            transition: var(--transition); outline: none;
        }
        .add-server-card:focus-visible { outline: var(--focus-outline); outline-offset: 2px; }
        .add-server-card:hover, .add-server-card:focus {
            background: rgba(229, 9, 20, 0.25); border-color: var(--accent); color: #fff;
        }
        .custom-server-form {
            background: rgba(0, 0, 0, 0.55); border-radius: 24px; padding: 16px;
            display: none; flex-direction: column; gap: 10px; margin: 0 14px 16px;
            border: 1px solid rgba(229, 9, 20, 0.3); animation: fadeSlide 0.25s ease;
        }
        @keyframes fadeSlide { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
        .custom-server-form input {
            background: rgba(20, 20, 30, 0.9); border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 36px; padding: 11px 14px; color: #fff; font-size: 0.85rem;
            outline: none; transition: var(--transition);
        }
        .custom-server-form input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.2); }
        .custom-server-form button {
            background: linear-gradient(95deg, #e50914, #b81c24); border: none; border-radius: 36px;
            padding: 12px; font-weight: 700; color: #fff; cursor: pointer; font-size: 0.85rem;
            transition: opacity 0.2s; letter-spacing: 0.3px;
        }
        .custom-server-form button:disabled { opacity: 0.55; cursor: not-allowed; }
        .error-msg { color: #ff8080; font-size: 0.7rem; display: none; text-align: center; }

        #contentTypeSelection {
            position: fixed; inset: 0;
            background: radial-gradient(ellipse at 30% 30%, #0f0f1a, #020203);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; padding: 1.5rem;
        }
        #contentTypeSelection h2 {
            font-size: 2rem; font-weight: 800; letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ff3b4a, #e50914, #b91c2c);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            margin-bottom: 2rem; text-align: center;
        }
        .type-cards { display: flex; flex-wrap: wrap; gap: 1.2rem; justify-content: center; max-width: 600px; width: 100%; }
        .type-card {
            flex: 1 1 140px; max-width: 180px;
            background: rgba(12, 12, 20, 0.85); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-radius: 28px; border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            padding: 24px 16px; cursor: pointer; transition: var(--transition); outline: none;
        }
        .type-card:focus-visible { outline: var(--focus-outline); outline-offset: 2px; }
        .type-card:hover, .type-card:focus { background: rgba(229, 9, 20, 0.25); border-color: var(--accent); transform: translateY(-3px); }
        .type-card .type-icon { font-size: 3.5rem; }
        .type-card .type-label { font-weight: 700; font-size: 1.1rem; color: #fff; }

        #mainInterface { display: none; width: 100%; height: 100%; background: #050508; }
        .app { display: flex; height: 100%; width: 100%; position: relative; }

        .sidebar {
            position: fixed; top: 0; left: 0; width: 275px;
            height: 100vh; height: 100dvh;
            background: rgba(6, 6, 11, 0.94); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            display: flex; flex-direction: column; z-index: 40;
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 8px 0 30px rgba(0, 0, 0, 0.6); transform: translateX(0);
        }
        .sidebar-header {
            padding: 16px 14px; display: flex; align-items: center; justify-content: space-between;
            font-size: 1.4rem; font-weight: 800; letter-spacing: -0.4px;
            background: linear-gradient(135deg, #ff4d5a, #e50914);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); flex-shrink: 0;
        }
        .sidebar-actions { display: flex; gap: 4px; }
        .change-server-btn, .history-btn {
            background: rgba(255,255,255,0.06); border: none; color: #fff; font-size: 1.1rem;
            cursor: pointer; padding: 4px 8px; border-radius: 40px; transition: 0.2s; outline: none;
        }
        .change-server-btn:focus-visible, .history-btn:focus-visible { outline: var(--focus-outline); outline-offset: 2px; }
        .change-server-btn:hover, .history-btn:hover, .change-server-btn:focus, .history-btn:focus { background: var(--accent); color: #fff; }

        .main-nav {
            display: flex; gap: 4px; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.04);
            flex-shrink: 0;
        }
        .main-nav-btn {
            flex: 1; background: rgba(255,255,255,0.03); border: 1px solid transparent;
            border-radius: 12px; color: #ccc; font-size: 0.7rem; font-weight: 600;
            padding: 8px 4px; cursor: pointer; transition: var(--transition);
            display: flex; flex-direction: column; align-items: center; gap: 2px; outline: none;
        }
        .main-nav-btn.active { background: var(--accent); color: #fff; border-color: rgba(255,255,255,0.2); box-shadow: 0 4px 12px rgba(229,9,20,0.3); }
        .main-nav-btn:hover:not(.active), .main-nav-btn:focus:not(.active) { background: rgba(229,9,20,0.25); border-color: rgba(229,9,20,0.5); }

        .search-container {
            padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.04);
            display: none; flex-shrink: 0; position: relative;
        }
        .search-container.visible { display: block; }
        .search-input {
            width: 100%; background: rgba(20, 20, 30, 0.9); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; padding: 8px 12px; color: #fff; font-size: 0.75rem;
            outline: none; transition: var(--transition);
        }
        .search-input:focus { border-color: var(--accent); }
        .search-suggestions {
            position: absolute; top: 100%; left: 10px; right: 10px;
            background: rgba(16,16,26,0.98); backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
            max-height: 180px; overflow-y: auto; z-index: 50; display: none;
            margin-top: 4px; box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .search-suggestions.show { display: block; }
        .search-suggestion-item {
            padding: 8px 12px; cursor: pointer; font-size: 0.75rem; color: #ddd;
            display: flex; align-items: center; gap: 6px; transition: 0.1s;
        }
        .search-suggestion-item:hover, .search-suggestion-item:focus { background: rgba(229,9,20,0.3); color: #fff; }

        .categories-list { flex: 1; overflow-y: auto; padding: 10px 8px; display: flex; flex-direction: column; gap: 4px; }
        .category-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 12px; background: rgba(255,255,255,0.025); border-radius: 14px;
            cursor: pointer; transition: var(--transition); border: 1px solid transparent;
            font-weight: 500; font-size: 0.82rem; outline: none; min-height: 42px;
        }
        .category-item:focus-visible { outline: var(--focus-outline); outline-offset: 2px; }
        .category-item.active { background: linear-gradient(95deg, #e50914, #c4121f); color: #fff; box-shadow: 0 4px 12px rgba(229,9,20,0.3); border-color: rgba(255,255,255,0.2); font-weight: 600; }
        .category-item:hover:not(.active), .category-item:focus:not(.active) { background: rgba(229,9,20,0.2); border-color: rgba(229,9,20,0.5); }
        .cat-count { background: rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 20px; font-size: 0.65rem; font-weight: 600; }
        .status-info { padding: 10px; font-size: 0.65rem; text-align: center; border-top: 1px solid rgba(255,255,255,0.04); color: #aaa; flex-shrink: 0; }

        .subcat-panel {
            position: fixed; left: 285px; top: 60px; width: 320px;
            max-height: calc(100% - 90px); background: var(--surface);
            backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            border-radius: 24px; border: 1px solid rgba(255,255,255,0.1);
            border-left: 4px solid var(--accent); padding: 6px 0; overflow-y: auto;
            z-index: 45; box-shadow: 12px 18px 35px rgba(0,0,0,0.55);
            transition: opacity 0.2s, transform 0.2s; transform-origin: top left;
        }
        .subcat-panel.hidden { opacity: 0; pointer-events: none; transform: scale(0.95); }
        .panel-title { padding: 10px 16px 12px; font-weight: 700; color: var(--accent); border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 4px; position: sticky; top: 0; background: var(--surface); z-index: 2; font-size: 0.9rem; }
        .channel-subitem, .movie-item, .series-item, .episode-item {
            padding: 10px 14px; cursor: pointer; transition: 0.12s; color: #eee;
            border-left: 2px solid transparent; font-size: 0.82rem; font-weight: 500;
            display: flex; align-items: center; gap: 10px; min-height: 44px; outline: none;
        }
        .channel-subitem:focus-visible, .movie-item:focus-visible, .series-item:focus-visible, .episode-item:focus-visible { outline: var(--focus-outline); outline-offset: -2px; background: rgba(229,9,20,0.25); }
        .channel-subitem:hover, .movie-item:hover, .series-item:hover, .episode-item:hover, .channel-subitem:focus, .movie-item:focus, .series-item:focus, .episode-item:focus { background: rgba(229,9,20,0.3); border-left-color: var(--accent); padding-left: 18px; }
        .item-logo { width: 36px; height: 36px; border-radius: 8px; object-fit: contain; background: rgba(255,255,255,0.05); flex-shrink: 0; border: 1px solid rgba(255,255,255,0.08); }
        .item-fallback { width: 36px; height: 36px; border-radius: 8px; background: rgba(229,9,20,0.2); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
        .item-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; padding: 10px; }
        .movie-card { background: rgba(25,25,35,0.8); border-radius: 16px; overflow: hidden; cursor: pointer; transition: var(--transition); border: 1px solid transparent; outline: none; }
        .movie-card:hover, .movie-card:focus { border-color: var(--accent); transform: translateY(-2px); }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: #111; }
        .movie-card .movie-title { padding: 6px 8px; font-size: 0.7rem; font-weight: 600; text-align: center; color: #ddd; }

        .history-popup {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90vw; max-width: 420px; max-height: 70vh;
            background: rgba(12, 12, 20, 0.95); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            border-radius: 28px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 30px 50px rgba(0,0,0,0.7);
            z-index: 200; display: none; flex-direction: column; overflow: hidden;
        }
        .history-popup.show { display: flex; }
        .history-popup-header { padding: 14px 16px; font-weight: 700; font-size: 1rem; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center; color: var(--accent); }
        .history-popup-close, .history-clear-btn { background: none; border: none; color: #fff; font-size: 1rem; cursor: pointer; padding: 4px 8px; border-radius: 20px; transition: 0.2s; margin-left: 4px; }
        .history-clear-btn { font-size: 0.9rem; color: #ff8080; }
        .history-popup-close:hover, .history-clear-btn:hover { background: rgba(255,255,255,0.1); }
        .history-list { flex: 1; overflow-y: auto; padding: 8px; }
        .history-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; cursor: pointer; transition: 0.15s; margin-bottom: 4px; background: rgba(255,255,255,0.02); }
        .history-item:hover { background: rgba(229,9,20,0.2); }
        .history-item .item-icon { font-size: 1.5rem; flex-shrink: 0; }
        .history-item .item-details { flex: 1; min-width: 0; }
        .history-item .item-title { font-weight: 600; font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-item .item-sub { font-size: 0.65rem; color: #aaa; margin-top: 2px; }
        .history-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 199; display: none; }
        .history-backdrop.show { display: block; }

        .resume-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 20;
        }
        .resume-overlay.show { display: flex; }
        .resume-dialog {
            background: rgba(20, 20, 30, 0.95); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 24px; padding: 24px 28px; text-align: center; color: #fff;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .resume-dialog p { font-size: 1rem; margin-bottom: 16px; }
        .resume-dialog button {
            background: var(--accent); border: none; color: #fff; font-weight: 700;
            padding: 10px 20px; border-radius: 30px; margin: 0 8px; cursor: pointer;
            font-size: 0.85rem; transition: 0.2s; outline: none;
        }
        .resume-dialog button:hover { opacity: 0.85; }
        .resume-dialog button.resume-no { background: rgba(255,255,255,0.15); }

        .main-content {
            flex: 1; margin-left: 275px; display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at 20% 30%, #0a0a12, #010103);
            padding: 20px; min-width: 0; height: 100vh; height: 100dvh; overflow-y: auto;
        }
        .player-wrapper {
            width: 100%; max-width: 1300px; border-radius: 24px; overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.65), 0 0 0 1px rgba(229,9,20,0.2);
            background: #000; position: relative; aspect-ratio: 16 / 9;
        }
        .video-container { position: relative; width: 100%; height: 100%; background: #000; cursor: pointer; }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
        .player-placeholder {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at 30% 30%, #11111d, #020206);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
            z-index: 2; transition: opacity 0.3s; pointer-events: none;
        }
        .player-placeholder.hidden { opacity: 0; }
        .loading-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.75);
            display: flex; align-items: center; justify-content: center; z-index: 15;
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: opacity 0.25s;
        }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .spinner { width: 48px; height: 48px; border: 4px solid rgba(229,9,20,0.2); border-top: 4px solid #e50914; border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .player-controls {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 60%, transparent 100%);
            padding: 45px 18px 14px; z-index: 10; opacity: 0;
            transition: opacity 0.4s ease; display: flex; flex-direction: column; gap: 8px; pointer-events: none;
        }
        .video-container.show-controls .player-controls { opacity: 1; pointer-events: auto; }
