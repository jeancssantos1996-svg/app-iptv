<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Claro TV+ · Central de Contas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
        }

        body {
            background: radial-gradient(circle at 10% 20%, #0b1423, #030617);
            min-height: 100vh;
            padding: 1.2rem 1rem 2rem;
        }

        .app-container {
            max-width: 580px;
            margin: 0 auto;
        }

        /* Cabeçalho com logo Claro TV+ */
        .claro-header {
            background: rgba(10, 20, 40, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 0.8rem 1.2rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border: 1px solid rgba(0, 160, 255, 0.3);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tv-icon {
            font-size: 2rem;
            filter: drop-shadow(0 2px 4px #00a0ff);
        }

        .logo-text {
            font-weight: 800;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #FFFFFF, #3b82f6, #00c3ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .badge-light {
            background: #1e2a3a;
            padding: 0.3rem 0.9rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #90caf9;
            border: 1px solid #2d4a6e;
        }

        /* Cartão de ações */
        .card-actions {
            background: rgba(18, 28, 45, 0.8);
            backdrop-filter: blur(8px);
            border-radius: 1.8rem;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            border: 1px solid #2d3e5e;
        }

        .search-section {
            margin-bottom: 1.5rem;
        }

        .search-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7e9ec5;
            margin-bottom: 0.6rem;
        }

        .search-box {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            background: #0c1425;
            border: 1px solid #2a3a55;
            border-radius: 3rem;
            padding: 0.9rem 1.2rem;
            font-size: 1rem;
            color: #ecf5ff;
            outline: none;
            transition: 0.2s;
        }

        .search-input:focus {
            border-color: #2f8cff;
            box-shadow: 0 0 0 2px #1e4b7a;
        }

        .btn-primary {
            background: linear-gradient(105deg, #1e5bc0, #0f3b80);
            border: none;
            border-radius: 3rem;
            padding: 0 1.6rem;
            font-weight: 600;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:active {
            transform: scale(0.97);
            background: #2b6ed7;
        }

        .btn-secondary {
            background: #1f2a44;
            border: 1px solid #345;
            border-radius: 3rem;
            padding: 0.7rem 1.2rem;
            font-weight: 500;
            color: #cbdffc;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            width: 100%;
        }

        .btn-secondary:active {
            background: #2a3a60;
        }

        /* Resultados */
        .results-area {
            background: #0b1120cc;
            border-radius: 1.6rem;
            padding: 0.2rem 0;
            backdrop-filter: blur(4px);
        }

        .account-card {
            background: #0f172fe6;
            border-radius: 1.4rem;
            padding: 1.2rem;
            margin-bottom: 1rem;
            border-left: 4px solid #2f8cff;
            transition: all 0.1s;
        }

        .account-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 10px;
        }

        .user-status {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .account-user {
            font-family: 'SF Mono', monospace;
            background: #010a1a;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #b9dcff;
            word-break: break-all;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #1a263a;
            border-radius: 3rem;
            padding: 0.2rem 0.7rem;
            font-size: 0.7rem;
            font-weight: 500;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.green { background: #22c55e; box-shadow: 0 0 4px #22c55e; }
        .status-dot.red { background: #ef4444; box-shadow: 0 0 4px #ef4444; }

        .button-group {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: #1f2a42;
            border: none;
            border-radius: 2rem;
            padding: 0.4rem 0.9rem;
            font-size: 0.7rem;
            font-weight: 500;
            color: #b9d0ff;
            cursor: pointer;
            transition: 0.1s;
        }

        .icon-btn:active {
            background: #2d4070;
        }

        .services-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .service-badge {
            background: #152032;
            border-radius: 2rem;
            padding: 0.3rem 0.9rem;
            font-size: 0.7rem;
            font-weight: 500;
            color: #9ac2f0;
            border: 1px solid #2b4870;
        }

        .pass-hidden {
            font-family: monospace;
            font-size: 0.85rem;
            background: #030b18;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            color: #a0c0e6;
            display: inline-block;
        }

        .empty-results {
            text-align: center;
            padding: 2rem;
            color: #7c8eb0;
        }

        .random-section {
            margin-top: 1rem;
            border-top: 1px dashed #2c3e5e;
            padding-top: 1.2rem;
        }

        .title-mini {
            font-size: 0.8rem;
            font-weight: 600;
            color: #8aacdf;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        footer {
            text-align: center;
            font-size: 0.65rem;
            color: #3b5170;
            margin-top: 1.5rem;
        }

        @media (max-width: 550px) {
            body { padding: 0.8rem; }
            .account-header { flex-direction: column; align-items: flex-start; }
            .button-group { align-self: flex-end; }
        }

        .toast-msg {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f9a6ed9;
            backdrop-filter: blur(10px);
            color: white;
            font-weight: 600;
            padding: 0.6rem 1.4rem;
            border-radius: 60px;
            font-size: 0.8rem;
            z-index: 1000;
            pointer-events: none;
            font-family: monospace;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="claro-header">
        <div class="logo-area">

</div>

    // ---------- Parse completo: usuário, senha, serviços e status ativo ----------
    function parseFullAccounts(txt) {
        const lines = txt.split(/\r?\n/);
        const accounts = [];
        for (let line of lines) {
            line = line.trim();
            if (line === "") continue;
            const firstPipe = line.indexOf(" | ");
            if (firstPipe === -1) continue; 
            const credPart = line.substring(0, firstPipe);
            const colonIdx = credPart.indexOf(":");
            if (colonIdx === -1) continue;
            const username = credPart.substring(0, colonIdx).trim();
            const password = credPart.substring(colonIdx + 1).trim();
            if (!username || !password) continue;
            
            // extrair serviços da parte após primeiro " | "
            const afterCred = line.substring(firstPipe + 3);
            const segments = afterCred.split(" | ");
            const services = [];
            let isActive = false; // flag de conta ativa baseada nos serviços
            for (let seg of segments) {
                seg = seg.trim();
                if (seg.includes("=")) {
                    const eqIndex = seg.indexOf("=");
                    const serviceName = seg.substring(0, eqIndex).trim().toUpperCase();
                    const status = seg.substring(eqIndex + 1).trim();
                    if (status.toLowerCase().includes("ativo") || status.toLowerCase().includes("ativar")) {
                        if (serviceName && serviceName !== "CPF") {
                            services.push(serviceName);
                            isActive = true;
                        }
                    }
                }
            }
            // Se não houver nenhum serviço listado, consideramos como ativo por padrão (só CPF)
            if (services.length === 0) isActive = true;
            const uniqueServices = [...new Set(services)];
            accounts.push({ user: username, pass: password, services: uniqueServices, isActive });
        }
        return accounts;
    }

    const searchInput = document.getElementById("searchInput");

    const randomBtn = document.getElementById("randomBtn");
    const dynamicResults = document.getElementById("dynamicResults");
    const emptyMessageDiv = document.getElementById("emptyMessage");
    
    // Toast
    function showToast(msg, isError = false) {
        let toast = document.querySelector(".toast-msg");
        if (toast) toast.remove();
        const div = document.createElement("div");
        div.className = "toast-msg";
        div.style.backgroundColor = isError ? "#dc2626dd" : "#1f9a6ed9";
        div.style.color = "white";
        div.innerText = msg;
        document.body.appendChild(div);
        setTimeout(() => {
            div.style.opacity = "0";
            setTimeout(() => div.remove(), 1700);
        }, 1700);
    }
    
    async function copyText(text, successMsg) {
        if (!text) return showToast("Nada para copiar", true);
        try {
            await navigator.clipboard.writeText(text);
            showToast(successMsg);
        } catch(e) {
            showToast("Erro ao copiar", true);
        }
    }
    
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === "&") return "&amp;";
            if (m === "<") return "&lt;";
            if (m === ">") return "&gt;";
            return m;
        });
    }
    
    function renderAccounts(accountsArray) {
        if (!accountsArray.length) {
            emptyMessageDiv.style.display = "block";
            dynamicResults.innerHTML = "";
            return;
        }
        emptyMessageDiv.style.display = "none";
        dynamicResults.innerHTML = accountsArray.map(acc => `
            <div class="account-card">
                <div class="account-header">
                    <div class="user-status">
                        <div class="account-user">👤 ${escapeHtml(acc.user)}</div>
                        <span class="status-badge">
                            <span class="status-dot ${acc.isActive ? 'green' : 'red'}"></span>
                            ${acc.isActive ? 'ATIVO' : 'OFFLINE'}
                        </span>
                    </div>
                    <div class="button-group">
                        <button class="icon-btn copy-user" data-user="${acc.user.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')}">📋 Copiar user</button>
                        <button class="icon-btn copy-pass" data-pass="${acc.pass.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')}">🔑 Copiar senha</button>
                    </div>
                </div>
                <div class="services-container">
                    ${acc.services.length ? acc.services.map(s => `<span class="service-badge">${escapeHtml(s)}</span>`).join('') : '<span style="color:#6b7f9f; font-size:0.7rem;">📡 Nenhum serviço extra listado</span>'}
                </div>
                <div style="margin-top: 10px; font-size:0.7rem; color:#5f7ea0;">🔒 senha: <span class="pass-hidden">${escapeHtml(acc.pass)}</span></div>
            </div>
        `).join('');
        
        document.querySelectorAll(".copy-user").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const user = btn.getAttribute("data-user");
                copyText(user, "👤 Usuário copiado!");
            });
        });
        document.querySelectorAll(".copy-pass").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const pass = btn.getAttribute("data-pass");
                copyText(pass, "🔑 Senha copiada!");
            });
        });
    }
    
    function searchAccounts(query) {
        if (!query.trim()) return [];
        const lowerQuery = query.trim().toLowerCase();
        return accountsDB.filter(acc => acc.user.toLowerCase().includes(lowerQuery));
    }
    
    function getRandomAccount() {
        if (accountsDB.length === 0) return null;
        const randIdx = Math.floor(Math.random() * accountsDB.length);
        return accountsDB[randIdx];
    }
    
    searchBtn.addEventListener("click", () => {
        const query = searchInput.value;
        const results = searchAccounts(query);
        if (results.length === 0) {
            emptyMessageDiv.style.display = "block";
            dynamicResults.innerHTML = "";
            showToast("Nenhuma conta encontrada", true);
        } else {
            renderAccounts(results);
        }
    });
    
    randomBtn.addEventListener("click", () => {
        const randAcc = getRandomAccount();
        if (randAcc) {
            renderAccounts([randAcc]);
            searchInput.value = "";
        } else {
            showToast("Erro ao sortear", true);
        }
    });
    
    const initialRand = getRandomAccount();
    if (initialRand) renderAccounts([initialRand]);
    else emptyMessageDiv.style.display = "block";
</script>
</body>
</html>
